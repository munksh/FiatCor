<?xml version="1.0" encoding="UTF-8"?>
<!-- Fiat Cor — app icon.

     House icon language: dark warm background, one cream instrument sitting
     in the Sailfish shape, one small amber accent, no text.
     Fiat Lux has the incident dome, Fiat Vox the tuning fork with the accent
     sounding between the tines. Fiat Cor has the heart, with the amber beat
     drawn across it — the accent sits where the action is, same idea.

     The trace stays inside the heart on purpose. Letting it run past the
     edges broke the silhouette at 86 px, which is the size that matters. -->
<svg xmlns="http://www.w3.org/2000/svg" width="86" height="86" viewBox="0 0 100 100">
  <rect x="0" y="0" width="100" height="100" rx="24" ry="24" fill="#1E1A12"/>

  <g transform="translate(50 52) scale(0.94) translate(-50 -52)">
    <path d="M50 78
             C 50 78, 22.5 60, 22.5 42.5
             C 22.5 32.1, 30.2 25.9, 38.3 25.9
             C 44.3 25.9, 48.3 29.9, 50 33.9
             C 51.7 29.9, 55.7 25.9, 61.7 25.9
             C 69.8 25.9, 77.5 32.1, 77.5 42.5
             C 77.5 60, 50 78, 50 78 Z"
          fill="#F4EED8"/>
  </g>

  <!-- dark backing stroke first, so the trace reads on cream at small sizes -->
  <path d="M33 47 L39 47 L43 51 L47.5 36 L52 54 L56 47 L67 47"
        fill="none" stroke="#1E1A12" stroke-width="5.2"
        stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M33 47 L39 47 L43 51 L47.5 36 L52 54 L56 47 L67 47"
        fill="none" stroke="#C87941" stroke-width="2.9"
        stroke-linejoin="round" stroke-linecap="round"/>
</svg>
